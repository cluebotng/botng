name: Deploy Tagged Release
on:
  release:
    types:
      - released
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: cluebotng/ci-update-component-ref@a3d44b0be0ffbaa147e8a79744c0e6a17f3bd27e # main
        with:
          tool: cluebotng-staging
          component: bot
          ref: '${{ inputs.ref || github.ref }}'
          gh_app_key: ${{ secrets.CI_COMPONENT_CONFIGS_APP_KEY }}
